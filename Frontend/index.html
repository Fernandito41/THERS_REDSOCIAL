<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tipografía e iconografía del nuevo diseño. Plus Jakarta Sans aparece
         en las 24 referencias y Material Symbols Outlined en 23 de 24
         (docs/THERS_REFERENCE_MANIFEST.md §2). Se cargan como hoja de estilos
         de Google Fonts, igual que los prototipos.
         NO se copia el <script src="cdn.tailwindcss.com"> de las maquetas:
         Tailwind se compila en el build (THERS_IMPLEMENTACION_MAESTRA §11). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />

    <title>THERS</title>
    <!-- SEO base (ADR-033-seo-foundation.md). Título, descripción, robots y
         canonical por ruta los aplica RouteSeo.jsx. NO hay <link rel="canonical">
         estático: en una SPA compartiría la home con todas las rutas. -->
    <meta name="description" content="THERS es una red social para conectar con tu gente, compartir y descubrir." />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:site_name" content="THERS" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
