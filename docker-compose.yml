services:
  postgres:
    image: postgres:16-alpine
    container_name: thers_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: thers
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: thers_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - thers_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  thers_postgres_data:
